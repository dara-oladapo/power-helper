name: Bug report
description: Something is broken, crashes, or behaves differently from what the screen says it will.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        If your GPU, refresh rate, brightness or power plan was left changed after Power Helper stopped, use the **stranded hardware** form instead — that one is triaged first.

        If a feature is greyed out and says it isn't available on your machine, that's the **hardware compatibility** form rather than this one.

  - type: dropdown
    id: area
    attributes:
      label: Where in the app
      options:
        - Tray icon or its menu
        - Settings window
        - Discrete GPU switching
        - Power plan switching
        - Refresh rate
        - Brightness lock
        - Low battery warning
        - Battery percentage or time remaining
        - Start with Windows
        - Installing, launching, or updating
        - Somewhere else
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what you expected instead
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the settings window on AC power
        2. Turn on "Lock brightness on battery" and set the level to 40%
        3. Unplug
        4. Brightness doesn't change until the window is reopened
    validations:
      required: true

  - type: dropdown
    id: power-state
    attributes:
      label: Were you on battery or AC?
      description: Almost everything in this app branches on this, so it's rarely irrelevant.
      options:
        - On battery
        - On AC power
        - It happened across a transition between the two
        - Doesn't apply
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Power Helper version
      description: Shown at the bottom of the settings window.
      placeholder: 0.2.0
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How you installed it
      options:
        - The Setup.exe installer
        - The portable .zip
        - Built from source
    validations:
      required: true

  - type: checkboxes
    id: known
    attributes:
      label: Before you file
      description: These are known and documented, so please check whether you're hitting one of them.
      options:
        - label: The app was running elevated. It always requests administrator rights, and a launch that was declined at the UAC prompt cannot change the GPU device or manage the startup task at all.
        - label: This isn't the manual GPU override not sticking. That button is deliberately a one-off — the next plug/unplug re-applies the automatic policy over it.
        - label: This isn't Best performance failing to be selected. The app deliberately only ever picks Power saver and Balanced; see the README for why.

  - type: textarea
    id: extra
    attributes:
      label: Screenshots or error text
      description: For a crash, the error text matters more than a description of it. Paste rather than screenshot where you can.
