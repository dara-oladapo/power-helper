name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # The app head is .NET MAUI, so the SDK alone can't build it. maui-windows rather
      # than the full maui workload: there is no Android/iOS/Mac head in this repo, and
      # installing those costs several minutes per run for nothing.
      - name: Install MAUI workload
        run: dotnet workload install maui-windows --skip-sign-check

      # One step, and no --no-restore. A separate restore followed by --no-restore let the
      # two evaluate the self-contained/RuntimeIdentifier graph differently, so the build
      # asked for runtime packs the restore hadn't been told to fetch.
      - name: Build
        run: dotnet build --configuration Release
