name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Self-contained + single-file: one .exe that bundles the .NET runtime, so it runs on
      # any Windows 10/11 machine with no separate install step. Trimming is deliberately
      # left off - this app leans on WMI/reflection (System.Management) that trimming can
      # break silently.
      - name: Publish
        run: >
          dotnet publish src/PowerHelper/PowerHelper.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.version.outputs.version }}
          -o publish

      - name: Rename artifact
        shell: bash
        # Copy, not move: the installer step below still needs publish/PowerHelper.exe as
        # its source file.
        run: cp publish/PowerHelper.exe "PowerHelper-${{ steps.version.outputs.version }}-win-x64.exe"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: cmd
        run: >
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          /DAppVersion=${{ steps.version.outputs.version }}
          /DSourceExe="${{ github.workspace }}\publish\PowerHelper.exe"
          installer\setup.iss

      # Pulls just this version's section out of CHANGELOG.md (between its "## [x.y.z]"
      # heading and the next one, or the trailing reference-link block) so the release
      # notes are the hand-written changelog entry, not GitHub's auto-generated
      # compare-link stub (all it can produce here, since this repo pushes straight to
      # main with no PRs to summarize). Uses index() rather than a dynamically-built
      # regex - tested locally and confirmed some awk builds silently mis-escape "\[ver\]"
      # into a bare character class that matches almost any line.
      - name: Extract changelog section
        shell: bash
        run: |
          awk -v ver="${{ steps.version.outputs.version }}" '
          /^## \[/ {
            if (found) exit
            if (index($0, "[" ver "]") > 0) { found=1; next }
          }
          found && /^\[[0-9]/ { exit }
          found { print }
          ' CHANGELOG.md > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PowerHelper-*.exe
            installer-output/*.exe
          body_path: release-notes.md
