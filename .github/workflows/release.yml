name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install MAUI workload
        run: dotnet workload install maui-windows --skip-sign-check

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Self-contained, unpackaged, and a directory rather than a single file.
      #
      # WinUI 3 - which the MAUI Windows head is built on - does not support
      # PublishSingleFile, so the previous one-file portable exe is not producible from this
      # stack. WindowsAppSDKSelfContained bundles the Windows App SDK runtime alongside the
      # .NET runtime, which is what keeps "no separate install step" true for the user even
      # though the payload is now a folder.
      #
      # Trimming stays off deliberately: this app leans on WMI/reflection
      # (System.Management) that trimming can break silently.
      - name: Publish
        run: >
          dotnet publish src/PowerHelper.App/PowerHelper.App.csproj
          -c Release
          -f net10.0-windows10.0.19041.0
          -r win-x64
          --self-contained true
          -p:WindowsPackageType=None
          -p:WindowsAppSDKSelfContained=true
          -p:Version=${{ steps.version.outputs.version }}
          -p:ApplicationDisplayVersion=${{ steps.version.outputs.version }}
          -o publish

      - name: Package portable archive
        shell: pwsh
        run: >
          Compress-Archive
          -Path publish\*
          -DestinationPath "PowerHelper-${{ steps.version.outputs.version }}-win-x64.zip"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: cmd
        run: >
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          /DAppVersion=${{ steps.version.outputs.version }}
          /DSourceDir="${{ github.workspace }}\publish"
          installer\setup.iss

      # Pulls just this version's section out of CHANGELOG.md (between its "## [x.y.z]"
      # heading and the next one, or the trailing reference-link block) so the release
      # notes are the hand-written changelog entry, not GitHub's auto-generated
      # compare-link stub (all it can produce here, since this repo pushes straight to
      # main with no PRs to summarize). Uses index() rather than a dynamically-built
      # regex - tested locally and confirmed some awk builds silently mis-escape "\[ver\]"
      # into a bare character class that matches almost any line.
      - name: Extract changelog section
        shell: bash
        run: |
          awk -v ver="${{ steps.version.outputs.version }}" '
          /^## \[/ {
            if (found) exit
            if (index($0, "[" ver "]") > 0) { found=1; next }
          }
          found && /^\[[0-9]/ { exit }
          found { print }
          ' CHANGELOG.md > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PowerHelper-*.zip
            installer-output/*.exe
          body_path: release-notes.md
